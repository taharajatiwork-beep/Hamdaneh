<style>
/* Style: herbarium. The whole app is one pressed-specimen sheet on a sage board: mono specimen labels, serif questions, photos in corner mounts, line-drawn plant. The red thread ("رشته") ties the two seed characters and runs through icons and the day strip. */
:root{
  --bg:#D9E0D4; --paper:#EEF1EA; --ink:#2F3B31; --muted:#657565; --line:#9FAE9F;
  --btn:#2F3B31; --on-btn:#EEF1EA; --leaf:#4D6B52; --thread:#C93C5E; --soil:#8A6A4F; --sun:#D9A62E; --water:#5FA8D3;
  --page:#F1F2E6; --p-sky:#D5E3E8; --p-sun:#E8D08A; --p-hill1:#9DB89A; --p-hill2:#7A9A7C; --p-a:#6B8F6E; --p-b:#B87A62;
  --serif:'Amiri',Georgia,serif; --mono:'DM Mono',ui-monospace,monospace; --font:'Vazirmatn',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C100C; --paper:#172017; --ink:#DCE6D9; --muted:#8FA08F; --line:#3A4C3C;
  --btn:#DCE6D9; --on-btn:#172017; --leaf:#8DB892; --thread:#F0728F; --soil:#6B5340; --sun:#E3B652; --water:#7DBDE3;
  --page:#222B22; --p-sky:#31434A; --p-sun:#B89B52; --p-hill1:#4E6B52; --p-hill2:#3A5440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C100C; --paper:#172017; --ink:#DCE6D9; --muted:#8FA08F; --line:#3A4C3C;
  --btn:#DCE6D9; --on-btn:#172017; --leaf:#8DB892; --thread:#F0728F; --soil:#6B5340; --sun:#E3B652; --water:#7DBDE3;
  --page:#222B22; --p-sky:#31434A; --p-sun:#B89B52; --p-hill1:#4E6B52; --p-hill2:#3A5440; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.8;font-variant-numeric:tabular-nums;
  padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:480px;margin:0 auto;background:var(--paper);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-7px;padding:22px 22px 18px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;transition:transform .12s ease-out,background-color .12s ease-out}
button:active{transform:scale(.97)}
button:focus-visible,textarea:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--leaf);outline-offset:2px}
h1,h2,h3,p,dl,dd,dt{margin:0}
.wrap{overflow-wrap:anywhere}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);direction:ltr;text-align:left}
.lab.fa{direction:rtl;text-align:start;font-family:var(--font);letter-spacing:0}
.lat{font-family:var(--serif);font-style:italic;font-size:20px;direction:ltr;text-align:left;line-height:1.3}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:start}
.logo svg{width:30px;height:30px}
.name{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.2}
.date{font-size:12px;color:var(--muted)}
.who{display:flex;gap:14px;font-size:13px}
.who button{border:0;background:transparent;padding:6px 0;color:var(--muted);border-bottom:2px solid transparent;min-height:36px}
.who button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--thread);font-weight:500}
.demo{font-size:11px;color:var(--muted);text-align:end}

section{padding-block:20px;border-top:1px solid var(--line)}
section.first{border-top:0;padding-top:6px}
h2{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.5}
.small{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}

.big{display:flex;align-items:baseline;gap:10px;line-height:1}
.big b{font-family:var(--serif);font-size:84px;font-weight:700}
.big span{font-size:14px;color:var(--muted)}
.scene{display:block;width:100%;height:auto;max-height:250px}
.strip{display:block;width:100%;height:auto;margin-top:4px}
.legend{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:4px}

.q{font-family:var(--serif);font-size:27px;font-weight:400;line-height:1.85;text-wrap:balance}
textarea,input[type=text],input[type=date]{width:100%;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:2px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.7}
textarea{min-height:92px;resize:vertical}
.starters{display:flex;gap:8px;flex-wrap:wrap}
.starters button,.chipbtn{border:1px solid var(--line);background:transparent;border-radius:2px;padding:5px 12px;font-size:13px;color:var(--muted);min-height:36px}
@media (hover:hover){.starters button:hover,.chipbtn:hover{color:var(--ink);border-color:var(--muted)}}
.btn{border:0;background:var(--btn);color:var(--on-btn);padding:10px 22px;border-radius:2px;font-weight:500;min-height:44px}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted)}
.status b{color:var(--ink);font-weight:500}
.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:12px;padding:6px 0;min-height:32px}

.unlock{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--thread);padding:10px 12px;margin-bottom:16px;border-radius:2px;animation:rise .45s ease-out both}

.card{border:1px solid var(--line);background:var(--bg);background:color-mix(in srgb,var(--paper) 70%,var(--bg));padding:8px 12px;display:flex;flex-direction:column}
.card .r{display:grid;grid-template-columns:64px 1fr;gap:8px;padding-block:6px;border-top:1px solid var(--line);align-items:start}

.card dd{overflow-wrap:anywhere}
.reveal{animation:rise .45s ease-out both}
.fav{border:0;background:transparent;font-size:12px;color:var(--muted);padding:2px 0;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:var(--thread);font-weight:500}

.mount{position:relative;padding:10px;background:color-mix(in srgb,var(--paper) 60%,var(--bg))}
.mount i{position:absolute;width:14px;height:14px;background:var(--ink);opacity:.7}
.mount i:nth-of-type(1){top:0;left:0;clip-path:polygon(0 0,100% 0,0 100%)}
.mount i:nth-of-type(2){top:0;right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.mount i:nth-of-type(3){bottom:0;left:0;clip-path:polygon(0 0,0 100%,100% 100%)}
.mount i:nth-of-type(4){bottom:0;right:0;clip-path:polygon(100% 0,0 100%,100% 100%)}
.mount img,.mount svg{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.addphoto{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--line);min-height:64px;color:var(--muted);font-size:13px;cursor:pointer;padding:8px}
.addphoto input{position:absolute;opacity:0;width:1px;height:1px}
.addphoto svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.addphoto:hover{color:var(--ink);border-color:var(--muted)}}

.jbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.book{background:var(--ink);padding:9px 9px 12px;border-radius:3px;position:relative;margin-bottom:38px}
.book:after{content:"";position:absolute;bottom:-28px;left:34px;width:12px;height:40px;background:var(--thread);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.pg{position:relative;background:var(--page);padding:20px 14px 24px;overflow:hidden;color:#2A2F2A;min-height:480px}
.pg.flip{transform-origin:left center;animation:flipin .5s ease-out both}
@keyframes flipin{from{transform:perspective(900px) rotateY(-22deg);opacity:.4}}
.tape{padding:6px 20px;background:var(--tc,#F2B8C6);color:#5A4A22;transform:rotate(-1.5deg);clip-path:polygon(0 0,100% 0,98% 25%,100% 50%,98% 75%,100% 100%,0 100%,2% 75%,0 50%,2% 25%);display:block;width:max-content;max-width:100%}
.tape.big{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.5}
.tape.sm{font-family:var(--mono);font-size:11px;background:#F2B8C6;color:#7A3A4C;margin-top:-2px;margin-inline-start:34px;transform:rotate(1deg);direction:ltr;padding:3px 16px}
.spread{display:grid;grid-template-columns:44% 1fr;gap:16px;align-items:start;margin-top:18px}
.spread.solo{grid-template-columns:1fr}
.coll{display:flex;flex-direction:column;gap:18px}
.pol{margin:0;background:#fff;padding:7px 7px 26px;box-shadow:0 2px 6px rgba(0,0,0,.22);transform:rotate(var(--rot));position:relative}
.pol img,.pol svg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.pol figcaption{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:'Aref Ruqaa',var(--serif);font-size:15px;color:#2A2F2A}
.ptape{position:absolute;top:-9px;left:50%;width:52px;height:16px;margin-left:-26px;background:#E3C16F;opacity:.8;transform:rotate(-4deg);z-index:1}
.note{background:#fff;padding:12px 12px 18px;box-shadow:0 2px 6px rgba(0,0,0,.18);background-image:repeating-linear-gradient(transparent 0 27px,#C9D8E2 27px 28px);position:relative;transform:rotate(.6deg);clip-path:polygon(0 3px,8% 0,17% 4px,28% 1px,40% 4px,52% 0,63% 3px,76% 1px,88% 4px,100% 1px,100% 100%,0 100%)}
.hq{font-family:'Aref Ruqaa',var(--serif);font-size:19px;line-height:28px;font-weight:700}
.note p{font-family:'Aref Ruqaa',var(--serif);font-size:17px;line-height:28px;margin:0;overflow-wrap:anywhere}
.note p b{font-weight:700;margin-inline-end:4px}
.note .dim{color:#7C877C;font-family:var(--font);font-size:13px}
.note .fav{color:#7C877C;padding:0 2px;min-height:0;vertical-align:middle}
.note .fav[aria-pressed="true"]{color:var(--thread)}
.stk{position:absolute;width:60px;height:60px;pointer-events:none;filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.stk svg{display:block;width:100%;height:100%}
.stk.on{pointer-events:auto;touch-action:none;cursor:grab}
.stk.sel{outline:1.5px dashed var(--thread);outline-offset:2px}
.tools{display:flex;flex-direction:column;gap:12px}
.trayrow{display:flex;gap:6px;flex-wrap:wrap}
.tray{width:44px;height:44px;border:1px solid var(--line);background:transparent;padding:4px;border-radius:2px}
.tray svg{width:100%;height:100%}
.rm{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--thread);color:#fff;z-index:3;line-height:1}
.idx{list-style:none;margin:0;padding:0}
.ix{display:flex;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 0;text-align:start;align-items:center}
.th{flex:none;width:64px;height:48px;overflow:hidden;display:block}
.th img,.th svg{width:100%;height:100%;object-fit:cover;display:block}
.ph0{display:block;width:100%;height:100%;border:1px dashed var(--line)}
.tx{display:flex;flex-direction:column;min-width:0;flex:1}
.ql{font-family:var(--serif);font-size:18px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (hover:hover){.ix:hover .ql{text-decoration:underline}}
.say{display:flex;flex-direction:column;gap:2px}
.say .nm{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.say .nm i{width:8px;height:8px;border-radius:50%;display:inline-block}
.say p{font-size:17px}
.pager{display:flex;justify-content:space-between;align-items:center}
.gico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.giftrow{display:flex;gap:12px;align-items:flex-start}
.giftrow .gico{color:var(--thread);width:28px;height:28px;margin-top:2px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding-block:10px;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list .gico{color:var(--thread)}
.muted{color:var(--muted)}
.meter{height:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf);transition:width .5s ease-out}

.tabs{display:flex;gap:18px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{flex:none;border:0;background:transparent;padding:8px 0;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;text-align:center;line-height:1.4}
.tabs button small{display:block;font-size:11px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--thread);font-weight:500}
.letter{padding:26px 22px;color:#fff;display:flex;flex-direction:column;gap:12px;background:var(--lc);position:relative}
.letter .motif{width:84px;height:auto;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.letter h2{font-family:var(--serif);font-size:32px;line-height:1.3}
.letter p{font-size:15px;line-height:2}
.letter .sig{font-family:var(--serif);font-size:20px;font-weight:700;margin-top:4px}
.letter .meta{font-family:var(--mono);font-size:11px;opacity:.8;direction:ltr;text-align:left}
.letter .seal{height:28px;margin-top:4px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 2px var(--paper)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.spr{width:44px;height:44px;border:1px solid var(--line);background:transparent;border-radius:2px;padding:4px}
.spr[aria-pressed="true"]{border-color:var(--ink)}
.spr svg{width:100%;height:100%}
.jokes{list-style:none;margin:0;padding:0}
.jokes li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:6px;border-top:1px solid var(--line);font-size:14px}
.jokes li:first-child{border-top:0}
.x{border:0;background:transparent;color:var(--muted);font-size:13px;min-height:32px}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);
  padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-right,0px))}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;font-size:12px;color:var(--muted);border-top:2px solid transparent;margin-top:-1px;min-height:52px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button svg .kn{fill:var(--thread);stroke:none}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--thread);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:2px;font-size:13px;z-index:20;max-width:90vw}

.bob{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
.hopg.hop{animation:hop .6s ease-out 1}
.sprout{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.4s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.2s infinite}
.zz{animation:zz 3.2s ease-out infinite}
.drop{animation:drop .9s ease-in both}
@keyframes breathe{50%{transform:scaleY(1.03) scaleX(.985)}}
@keyframes hop{40%{transform:translateY(-16px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-14px)}}
@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(70px);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
var KEY='bagh-ma-v5';
var fa=function(n){return Number(n).toLocaleString('fa-IR')};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}

var TODAY=new Date();TODAY.setHours(12,0,0,0);

var DM={day:'numeric',month:'long'};
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var COLORS=['#6FA67A','#E8806A','#E5B04A','#A38BD0','#5FA8D3','#D8668C'];
var SPROUTS=[['leaf','برگ'],['bud','غنچه'],['clover','شبدر'],['tuft','سبزه']];
/* features unlock one by one as completed days grow */
var UNLOCK=[{id:'garden',n:1,name:'باغ',msg:'باغ باز شد. اولین جوانه از خاک بیرون آمد.'},
            {id:'journal',n:3,name:'ژورنال',msg:'ژورنال باز شد. حالا می‌توانید برای هر روز عکس هم بگذارید.'},
            {id:'letter',n:7,name:'نامه‌ها',msg:'نامه‌ها باز شدند. اولین نامه‌ی شما از خاطره‌های خودتان آماده است.'},
            {id:'us',n:14,name:'صفحه‌ی «ما»',msg:'صفحه‌ی «ما» باز شد: نام، لقب و کلمه‌های رمزی شما.'}];

var QS=[
'امروز چه چیزی تو را به یاد من انداخت؟','کوچک‌ترین کاری که امروز حالت را خوب کرد چه بود؟','اگر فردا یک روز آزاد داشتیم، کجا می‌رفتیم؟',

var STK=['sprig','flower','seeds','knot','star','stamp','mushroom','tape'];
var STKN={sprig:'شاخه',flower:'گل',seeds:'دانه‌ها',knot:'گره',star:'ستاره',stamp:'مُهر',mushroom:'قارچ',tape:'چسب'};
function stkSVG(t){

  else if(t==='seeds')o='<ellipse cx="17" cy="32" rx="9" ry="12" fill="'+a+'"/><ellipse cx="43" cy="32" rx="9" ry="12" fill="'+b+'"/><path d="M26 36Q30 48 34 36" stroke="#C93C5E" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M17 20v-6M43 20v-6" stroke="#4D6B52" stroke-width="2.4" stroke-linecap="round"/>';

  return '<svg viewBox="0 0 60 60" aria-hidden="true">'+o+'</svg>';
}
var TAPEC=['#E3C16F','#F2B8C6','#B9D3B5'];
var SLOTS=[{x:.74,y:.03},{x:.02,y:.86},{x:.76,y:.86},{x:.40,y:.92}];
function hashKey(k){var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))%9973;return h}
/* every page starts decorated, so nobody faces a blank sheet */
function pageOf(k){
  if(st.pages[k])return st.pages[k];
  var h=hashKey(k),i=h%SLOTS.length,j=(i+2)%SLOTS.length,t1=STK[h%STK.length],t2=STK[(h+3)%STK.length];
  if(t1===t2)t2='sprig';
  return {tape:h%3,stk:[{t:t1,x:SLOTS[i].x,y:SLOTS[i].y,r:(h%30)-15,s:1},{t:t2,x:SLOTS[j].x,y:SLOTS[j].y,r:((h>>1)%30)-15,s:1}]};
}
function ensurePage(k){if(!st.pages[k])st.pages[k]=JSON.parse(JSON.stringify(pageOf(k)));return st.pages[k]}
function jEntries(){return Object.keys(st.answers).filter(function(k){return st.answers[k].a||st.answers[k].b}).sort().reverse()}
function curKey(){var keys=jEntries();return (st.jopen&&st.answers[st.jopen])?st.jopen:keys[0]}

function viewJournal(){
  var keys=jEntries();
  if(!keys.length)return '<section class="first stack"><h1 class="q">ژورنال ما</h1><p class="small">اولین روز کامل شما اینجا به یک صفحه تبدیل می‌شود.</p></section>';
  if(st.jindex)return viewIndex(keys);
  var k=curKey(),i=keys.indexOf(k),newer=keys[i-1],older=keys[i+1],ed=st.jedit;
  var o='<div class="jbar"><h1 class="q" style="font-size:22px">ژورنال ما</h1><button class="link" data-act="jindex">فهرست</button></div>';
  o+='<div class="book">'+bookPage(k,ed)+'</div>';
  if(ed){
    o+='<div class="tools"><div class="trayrow" role="group" aria-label="برچسب‌ها">'+STK.map(function(t){return '<button class="tray" data-act="addstk" data-v="'+t+'" aria-label="'+STKN[t]+'">'+stkSVG(t)+'</button>'}).join('')+'</div>';
    o+=(fx.sel!=null&&pageOf(k).stk[fx.sel])?'<div class="row"><button class="chipbtn" data-act="stkrot">بچرخان</button><button class="chipbtn" data-act="stkbig">بزرگ‌تر</button><button class="chipbtn" data-act="stksmall">کوچک‌تر</button><button class="chipbtn" data-act="stkdel">حذف</button></div>':'<p class="small">روی یک برچسب بزن تا اضافه شود، بعد با انگشت جابه‌جایش کن.</p>';
    if(picsOf(k).length<3&&done(k))o+=photoAdd(k,'عکس اضافه کن');
    o+='<div class="row"><button class="btn" data-act="jdone">تمام شد</button></div></div>';
  } else {
    o+='<div class="row" style="justify-content:space-between">'+
      (older?'<button class="link" data-act="jopen" data-v="'+older+'">صفحه‌ی قبل</button>':'<span></span>')+
      '<button class="btn alt" data-act="jedit">تزئین صفحه</button>'+
      (newer?'<button class="link" data-act="jopen" data-v="'+newer+'">صفحه‌ی بعد</button>':'<span></span>')+'</div>';
    if(!picsOf(k).length&&done(k))o+='<div style="margin-top:14px">'+photoAdd(k,'عکس این روز را اضافه کن')+'</div>';
  }
  return o;
}
function bookPage(k,ed){
  var a=st.answers[k],f=st.fav[k]||{},both=done(k),P=pageOf(k),pics=picsOf(k);
  var o='<div class="pg'+(fx.flip?' flip':'')+'" data-k="'+k+'">';
  o+='<div class="tape big" style="--tc:'+TAPEC[P.tape||0]+'">'+pf(parse(k),{weekday:'long',day:'numeric',month:'long'})+'</div><div class="tape sm">SPECIMEN '+qNum(k)+'</div>';
  o+='<div class="spread'+(pics.length?'':' solo')+'">';
  if(pics.length)o+='<div class="coll">'+pics.map(function(v,i){return '<figure class="pol" style="--rot:'+[-3,2.5,-2][i]+'deg"><span class="ptape"></span>'+picHTML(v)+'<figcaption>'+(i===0?'روز '+fa(qNum(k)):'')+'</figcaption>'+(ed?'<button class="rm" data-act="rmphoto" data-k="'+k+'" data-i="'+i+'" aria-label="حذف عکس">×</button>':'')+'</figure>'}).join('')+'</div>';
  o+='<div class="note"><h3 class="hq">'+qFor(k)+'</h3>';
  ['a','b'].forEach(function(p){
    var hidden=a[p]&&!both&&p!==st.me;
    o+='<p><b style="border-bottom:2px solid '+st.p[p].color+'">'+esc(nm(p))+'</b> '+
      (!a[p]?'<span class="dim">هنوز جواب نداده</span>':hidden?'<span class="dim">پنهان تا وقتی تو هم جواب بدهی</span>':esc(a[p])+
      (both&&!ed?' <button class="fav" data-act="fav" data-k="'+k+'" data-p="'+p+'" aria-pressed="'+!!f[p]+'" aria-label="گره بزن">'+knotIcon(!!f[p])+'</button>':''))+'</p>';
  });
  o+='</div></div>';
  P.stk.forEach(function(s,i){o+='<div class="stk'+(ed?' on':'')+((ed&&fx.sel===i)?' sel':'')+'" data-i="'+i+'" data-x="'+s.x+'" data-y="'+s.y+'" style="left:'+(s.x*100)+'%;top:'+(s.y*100)+'%;transform:rotate('+s.r+'deg) scale('+s.s+')">'+stkSVG(s.t)+'</div>'});
  return o+'</div>';
}
function viewIndex(keys){
  var o='<div class="jbar"><h1 class="q" style="font-size:22px">فهرست</h1><button class="link" data-act="jindex">بازگشت به دفتر</button></div><ul class="idx">';
  keys.forEach(function(k){
    var v=picsOf(k)[0],thumb=v?(v==='demo'?'<svg viewBox="0 0 120 90" aria-hidden="true"><use href="#photo"/></svg>':'<img src="'+v+'" alt="">'):'<span class="ph0"></span>';
    o+='<li><button class="ix" data-act="jopen" data-v="'+k+'"><span class="th">'+thumb+'</span><span class="tx"><span class="lab fa">'+fa(qNum(k))+' · '+pf(parse(k),DM)+'</span><span class="ql">'+qFor(k)+'</span></span></button></li>';
  });
  return o+'</ul>';
}

/* dragging stickers while decorating */
var drag=null;
document.addEventListener('pointerdown',function(e){
  var s=e.target.closest&&e.target.closest('.stk.on');if(!s||!st.jedit)return;
  var pg=s.parentElement,r=pg.getBoundingClientRect();
  drag={el:s,idx:+s.dataset.i,k:pg.dataset.k,r:r,sx:e.clientX,sy:e.clientY,ox:parseFloat(s.dataset.x),oy:parseFloat(s.dataset.y),moved:false,nx:null,ny:null};
  try{s.setPointerCapture(e.pointerId)}catch(x){}
  e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
  if(!drag.moved)return;
  drag.nx=Math.max(-.04,Math.min(.9,drag.ox+dx/drag.r.width));drag.ny=Math.max(-.02,Math.min(.92,drag.oy+dy/drag.r.height));
  drag.el.style.left=(drag.nx*100)+'%';drag.el.style.top=(drag.ny*100)+'%';
});
function endDrag(){
  if(!drag)return;var d=drag;drag=null;
  fx.sel=d.idx;
  if(d.moved&&d.nx!==null){var P=ensurePage(d.k);if(P.stk[d.idx]){P.stk[d.idx].x=d.nx;P.stk[d.idx].y=d.ny}save()}
  render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

var STOP='از به که را در با و این آن یک من تو هم برای ما بود می است تا رو ولی چه همین اینکه وقتی هر یا اگر کنار هنوز دوست داری دارم توی بابت کدام'.split(' ');
function topWord(){
  var c={},bw='',n=0;
  for(var k in st.answers){var a=st.answers[k];[a.a,a.b].forEach(function(t){
    if(!t)return;t.replace(/[.،؟!«»:؛()…]/g,' ').split(/\s+/).forEach(function(w){
      if(w.length<3||STOP.indexOf(w)>-1)return;c[w]=(c[w]||0)+1;if(c[w]>n){n=c[w];bw=w}})})}
  return bw;
}
function pickQuote(){
  var p=other(),keys=Object.keys(st.answers).filter(function(k){return st.answers[k][p]}).sort().reverse(),pick=null;
  for(var i=0;i<keys.length;i++){var k=keys[i];if(st.fav[k]&&st.fav[k][p]){pick=k;break}}
  if(!pick)pick=keys[0];
  return pick?{t:st.answers[pick][p],who:nm(p)}:null;
}
function occs(){
  var an=parse(st.anniv),y=TODAY.getFullYear(),ad=new Date(y,an.getMonth(),an.getDate(),12);
  if(diff(ad,TODAY)<0)ad=new Date(y+1,an.getMonth(),an.getDate(),12);
  var list=[
   {id:'anniv',n:'سالگرد ما',date:dkey(ad),c:'#7A2A45',years:ad.getFullYear()-an.getFullYear(),intro:'امروز سالگرد ماست و من هنوز هم خوشحالم که تو را پیدا کردم.',end:'سال دیگر هم همین‌جا، کنار هم.'},
   {id:'yalda',n:'شب یلدا',date:'2026-12-21',c:'#6E2230',intro:'بلندترین شب سال را برای کوتاه کردنش به تو نیاز دارم.',end:'انار و حافظ را من می‌آورم، تو فقط بیا.'},
   {id:'xmas',n:'کریسمس',date:'2026-12-25',c:'#2F5A44',intro:'برف باشد یا نباشد، گرم‌ترین جای دنیا کنار توست.',end:'کریسمس مبارک.'},
   {id:'val',n:'ولنتاین',date:'2027-02-14',c:'#8F3552',intro:'یک روز در سال برای گفتن چیزی که هر روز می‌دانیم.',end:'دوستت دارم، همان‌قدر که دیروز.'},
   {id:'nowruz',n:'نوروز ۱۴۰۶',date:'2027-03-21',c:'#3D6B4E',intro:'سال نو می‌شود و من دوباره دعا می‌کنم که تو کنار من باشی.',end:'سال نو مبارک، همسفر من.'},
   {id:'hal',n:'هالووین',date:'2027-10-31',c:'#4B3A5E',intro:'ترسناک‌ترین شب سال، خوب است که دست تو را دارم.',end:'ترفند یا عیدی؟ هر دو را از تو می‌خواهم.'}
  ];
  return list.filter(function(o){return diff(parse(o.date),TODAY)>=0}).sort(function(x,y){return x.date<y.date?-1:1});
}
function letterData(){
  var list=occs(),oc=list.filter(function(o){return o.id===st.occ})[0]||list[0],q=pickQuote(),w=topWord(),j=st.jokes[0];
  var lines=[addr(other())+' جان،',oc.intro,
   (oc.years>0&&isOpen('us'))?fa(oc.years)+' سال است که کنار هم هستیم.':'',
   'از روزی که باغمان را شروع کردیم، '+fa(total())+' روز کامل با هم آمده‌ایم و بلندترین رشته‌ی ما '+fa(best())+' روز بوده است.',
   w?'پرتکرارترین کلمه‌ی جواب‌هایمان «'+w+'» بود.':'',
   q?'از میان همه‌ی خاطرات، این جمله را نگه داشته‌ام: «'+q.t+'» — '+q.who:'',
   j?'و وقتی می‌گویم «'+j+'»، تو می‌دانی یعنی چه.':'',
   oc.end].filter(Boolean);
  return {oc:oc,lines:lines,sig:'برای تو، '+addr(st.me)};
}
function viewLetter(){
  var list=occs(),d=letterData(),oc=d.oc;
  var o='<section class="first stack"><h1 class="q">نامه‌ی مناسبتی</h1><p class="small">نامه از جواب‌ها'+(isOpen('us')?'، لقب‌ها و کلمه‌های رمزی':'')+' خودتان ساخته می‌شود.</p>'+
   '<div class="tabs" role="group" aria-label="مناسبت">'+list.map(function(x){var dd=diff(parse(x.date),TODAY);return '<button data-act="occ" data-v="'+x.id+'" aria-pressed="'+(x.id===oc.id)+'">'+x.n+'<small>'+(dd===0?'امروز':fa(dd)+' روز دیگر')+'</small></button>'}).join('')+'</div></section>';
  o+='<section class="first"><article class="letter" style="--lc:'+oc.c+'"><svg class="motif" viewBox="0 0 80 60" aria-hidden="true">'+MOTIF[oc.id]+'</svg><span class="meta">'+pf(parse(oc.date),DM)+'</span><h2>'+oc.n+'</h2>'+
   d.lines.map(function(l){return '<p class="wrap">'+esc(l)+'</p>'}).join('')+'<div class="sig">'+esc(d.sig)+'</div>'+
   '<svg class="seal" viewBox="0 0 200 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14Q50 2 100 14T200 14" stroke="#fff" stroke-opacity=".7" stroke-width="2" fill="none"/><circle cx="100" cy="14" r="6" fill="#fff"/></svg></article></section>';
  o+='<section class="first"><div class="row"><button class="btn" data-act="copy">کپی متن نامه</button></div></section>';
  return o;
}
function viewUs(){
  var o='<section class="first stack"><h1 class="q">ما</h1><p class="small">اینجا همه‌چیز مال خودتان است. هرچه بنویسید در پرسش‌ها و نامه‌ها دیده می‌شود.</p>'+
   sceneSVG('u','happy','happy',stageOf(total()),false,false,false)+'</section>';
  ['a','b'].forEach(function(k){
    var p=st.p[k];
    o+='<section class="stack"><h2>دانه‌ی '+esc(nm(k))+'</h2><div class="grid2"><div class="field"><label for="n-'+k+'">نام</label><input type="text" id="n-'+k+'" data-bind="'+k+'.name" value="'+esc(p.name)+'" maxlength="24"></div>'+
     '<div class="field"><label for="l-'+k+'">لقبی که شریکت صدایت می‌زند</label><input type="text" id="l-'+k+'" data-bind="'+k+'.nick" value="'+esc(p.nick)+'" maxlength="24" placeholder="مثلاً: جوجو"></div></div>'+
     '<div class="field"><label>رنگ</label><div class="swatches">'+COLORS.map(function(c){return '<button class="sw" style="background:'+c+'" data-act="color" data-k="'+k+'" data-v="'+c+'" aria-pressed="'+(p.color===c)+'" aria-label="رنگ"></button>'}).join('')+'</div></div>'+
     '<div class="field"><label>جوانه‌ی روی سر</label><div class="swatches">'+SPROUTS.map(function(s){return '<button class="spr" data-act="sprout" data-k="'+k+'" data-v="'+s[0]+'" aria-pressed="'+(p.sprout===s[0])+'" aria-label="'+s[1]+'">'+sproutIcon(s[0],p.color)+'</button>'}).join('')+'</div></div></section>';
  });
  o+='<section class="stack"><h2>سالگرد ما</h2><div class="field"><label for="anniv">تاریخ شروع</label><input type="date" id="anniv" data-bind="anniv" value="'+esc(st.anniv)+'"></div><p class="small" id="annivfa">'+pf(parse(st.anniv),{day:'numeric',month:'long',year:'numeric'})+'</p></section>';
  o+='<section class="stack"><h2>کلمه‌های رمزی ما</h2><p class="small">جمله یا کلمه‌ای که فقط شما معنی‌اش را می‌دانید. در نامه‌ها می‌آید.</p><ul class="jokes">'+
   st.jokes.map(function(j,i){return '<li><span class="wrap">'+esc(j)+'</span><button class="x" data-act="jokedel" data-v="'+i+'">حذف</button></li>'}).join('')+'</ul>'+
   '<div class="row" style="flex-wrap:nowrap"><input type="text" id="joke" placeholder="مثلاً: چای سرد شد" maxlength="40" aria-label="کلمه‌ی رمزی تازه"><button class="btn alt" data-act="jokeadd" style="flex:none">افزودن</button></div></section>';
  return o;
}

var TABNAME={today:'امروز',garden:'باغ',journal:'ژورنال',letter:'نامه'};
function render(){
  if(!isOpen(st.tab))st.tab='today';
  var v={today:viewToday,garden:viewGarden,journal:viewJournal,letter:viewLetter,us:viewUs}[st.tab]();
  document.getElementById('app').innerHTML=header()+'<main>'+v+'</main>';
  var tabs=['today','garden','journal','letter'].filter(isOpen);
  var nw=qs('navw');nw.hidden=tabs.length<2;
  document.getElementById('nav').innerHTML=tabs.map(function(t){return '<button data-act="tab" data-v="'+t+'"'+(st.tab===t?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+NAVI[t]+'</svg>'+TABNAME[t]+'</button>'}).join('');
  if(st.tab==='today'){var sc=sceneState();animateScene(sc.dist)}
  if(st.tab==='us')placeScene('u',110);
  fx.watered=false;fx.hop.a=false;fx.hop.b=false;fx.flip=false;
}
var tt;function toast(m){var e=document.getElementById('toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2400)}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(18)}catch(e){}}
function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();
    im.onload=function(){var m=720,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};
    im.onerror=function(){cb(null)};im.src=r.result};
  r.onerror=function(){cb(null)};r.readAsDataURL(file);
}
function finish(){syncUnlocks();save();render()}

document.addEventListener('input',function(ev){
  var t=ev.target,b=t.getAttribute&&t.getAttribute('data-bind');if(!b)return;
  var parts=b.split('.');
  if(parts.length===2)st.p[parts[0]][parts[1]]=t.value;
  else if(b==='anniv'&&t.value){st.anniv=t.value;var f=qs('annivfa');if(f)f.textContent=pf(parse(t.value),{day:'numeric',month:'long',year:'numeric'})}
  save();
});
document.addEventListener('change',function(ev){
  var t=ev.target,k=t.getAttribute&&t.getAttribute('data-photo');if(!k||!t.files||!t.files[0])return;
  shrink(t.files[0],function(url){
    if(!url){toast('این فایل خوانده نشد. عکس دیگری امتحان کنید.');return}
    var prev=picsOf(k).slice();st.photos[k]=prev.concat([url]);
    if(!save()){st.photos[k]=prev;toast('جای ذخیره‌سازی پر است. عکس کوچک‌تری امتحان کنید.');return}
    toast('عکس به صفحه اضافه شد');render();
  });
});
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,v=b.dataset.v;
  if(act==='starter'){var ta=document.getElementById('ans');if(ta){ta.value=v+' ';ta.focus()}return}
  if(act==='jopen'){st.jopen=v;st.jindex=false;st.jedit=false;fx.sel=null;fx.flip=true;window.scrollTo(0,0)}
  else if(act==='jindex'){st.jindex=!st.jindex}
  else if(act==='jedit'){st.jedit=true;fx.sel=null}
  else if(act==='jdone'){st.jedit=false;fx.sel=null}
  else if(act==='addstk'){var PG=ensurePage(curKey());PG.stk.push({t:v,x:.4,y:.45,r:0,s:1});fx.sel=PG.stk.length-1}
  else if(act==='stkrot'||act==='stkbig'||act==='stksmall'||act==='stkdel'){
    var PS=ensurePage(curKey()),SS=PS.stk[fx.sel];
    if(SS){if(act==='stkrot')SS.r=(SS.r+15)%360;else if(act==='stkbig')SS.s=Math.min(2.2,+(SS.s+.2).toFixed(2));else if(act==='stksmall')SS.s=Math.max(.5,+(SS.s-.2).toFixed(2));else{PS.stk.splice(fx.sel,1);fx.sel=null}}
  }
  else if(act==='rmphoto'){var rk=b.dataset.k,pl=picsOf(rk).slice();pl.splice(+b.dataset.i,1);st.photos[rk]=pl}
  else if(act==='jback'){st.jopen=null;window.scrollTo(0,0)}
  else if(act==='tab'){st.tab=v;st.jopen=null;st.jindex=false;st.jedit=false;st.pending=st.pending.filter(function(x){return x!==v});window.scrollTo(0,0)}
  else if(act==='gounlock'){st.tab=v;st.pending=st.pending.filter(function(x){return x!==v});window.scrollTo(0,0)}
  else if(act==='who'){st.me=v}
  else if(act==='submit'){
    var t=document.getElementById('ans').value.trim();
    if(!t){toast('اول جوابت را بنویس');return}
    var was=done(TK);
    st.answers[TK]=st.answers[TK]||{};st.answers[TK][st.me]=t;
    fx.hop[st.me]=true;buzz();
    if(!was&&done(TK)){fx.watered=true;fx.hop.a=fx.hop.b=true;toast('هر دو جواب دادید. نخ شل شد و باغ آبیاری شد.')}
    else toast('جواب ثبت شد');
  }
  else if(act==='gift'){st.opened[TK]=GIFTS[Math.floor(Math.random()*GIFTS.length)].id;buzz()}
  else if(act==='fav'){var k=b.dataset.k,p=b.dataset.p;st.fav[k]=st.fav[k]||{};st.fav[k][p]=!st.fav[k][p]}
  else if(act==='rest'){if(restLeft()>0&&!done(TK)){st.rest[TK]=true;toast('امروز استراحت است، نخ می‌ماند')}}
  else if(act==='occ'){st.occ=v}
  else if(act==='color'){st.p[b.dataset.k].color=v}
  else if(act==='sprout'){st.p[b.dataset.k].sprout=v}
  else if(act==='jokeadd'){var jv=document.getElementById('joke').value.trim();if(!jv)return;st.jokes.push(jv)}
  else if(act==='jokedel'){st.jokes.splice(+v,1)}
  else if(act==='reset'){st=seed();lastDist=null}
  else if(act==='resetfresh'){st=fresh();lastDist=null}
  else if(act==='copy'){
    var d=letterData(),txt=d.oc.n+'\n\n'+d.lines.join('\n\n')+'\n\n'+d.sig;
    var fb=function(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('نامه کپی شد')}catch(e){toast('کپی نشد، متن را دستی انتخاب کنید')}ta.remove()};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('نامه کپی شد')},fb);else fb();
    return;
  }
  finish();
});
syncUnlocks();
render();
})();
</script>
